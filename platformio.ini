; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; default_envs limits `pio run` (no -e) and the IDE's Build/Upload/Monitor
; buttons to the real firmware target. [env:native] (below) is a test-only
; env with no main() of its own -- it stays fully usable, but only via an
; explicit `pio test -e native`, never picked up by the default build/upload.
[platformio]
default_envs = lolin_c3_mini

[env:lolin_c3_mini]
platform = espressif32
board = lolin_c3_mini
framework = arduino
board_build.partitions = default.csv

monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder

lib_deps =
    bblanchon/ArduinoJson @ ^6.21.5
    bogde/HX711 @ ^0.7.5
    adafruit/DHT sensor library@^1.4.6

build_flags =
    -D PIN_FACTORY_RESET=9
    -D PIN_INTERNAL_LED=8
    -D HX711_DOUT=3
    -D HX711_SCK=4
    -D DHT22_DATA=1
    ; Debug: naechste Zeile reinkommentieren -> kein Light Sleep,
    ; USB-Serial-JTAG bleibt stabil (Konsole/Upload durchgehend).
    -D DISABLE_LIGHT_SLEEP

; Host-native unit tests for hardware-free logic modules only (no WiFi/NVS/
; sensor access on this platform) -- run with `pio test -e native`, no board
; needed. build_src_filter keeps out every src/*.cpp that touches Arduino/
; ESP-IDF (WiFi, Preferences, HX711, mbedtls, ...); only add a module here
; once it's confirmed dependency-free, see CLAUDE.md "Tests" section.
;
; NOTE: this env has no main() of its own (only the test/ files under it do,
; and pio test wires those in) -- a plain `pio run` (no -e, or an IDE "build
; all") tries to link it as a normal program and fails with "undefined
; reference to main". That's expected, not a regression: always target it
; explicitly via `pio test -e native`, never `pio run -e native`.
[env:native]
platform = native
test_build_src = yes
build_src_filter = -<*> +<JsonEscape.cpp> +<DigestHeaderParser.cpp>
test_framework = unity
build_flags = -std=c++17